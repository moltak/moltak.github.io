backend:
  name: github
  repo: moltak/moltak.github.io
  branch: main
  auth_methods: [token]

media_folder: public/images
public_folder: /images

output:
  omit_empty_optional_fields: true

collections:
  - name: blog
    label: 블로그
    label_singular: 글
    folder: src/content/blog
    path: "{{slug}}/index"
    extension: mdx
    create: true
    summary: "{{title}} ({{date | date('YYYY-MM-DD')}})"
    # Listing columns: title/date retained; description and body show ~20-char excerpts via
    # template columns; updated/featured reference their widgets directly and stay blank
    # when the optional fields are absent from a post.
    table_columns:
      - title
      - date
      - { field: "{{description | truncate(20, '...')}}", label: 설명 }
      - { field: "{{body | plainify | truncate(20, '...')}}", label: 본문 }
      - updated
      - featured
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    media_folder: ""
    public_folder: ""
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: description, label: 설명, widget: text }
      - { name: date, label: 작성일, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: updated, label: 수정일, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
      - { name: draft, label: 임시 글, widget: boolean, default: false, required: false }
      - { name: featured, label: 추천 글, widget: boolean, default: false, required: false }
      # Default is the raw Markdown/MDX source editor (first mode wins). rich_text is
      # opt-in visual editing: convenient for plain Markdown and clipboard paste, but it
      # re-serializes content through its editor and can corrupt MDX components and JSX
      # expressions. Only switch modes on posts that use plain Markdown.
      - { name: body, label: 본문 (Markdown/MDX), widget: markdown, modes: [raw, rich_text] }
